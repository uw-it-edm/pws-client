plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '7.2.1' apply false
    id 'maven-publish'
}

allprojects {
    group = 'edu.uw.edm.pws'
    version = '2.0.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'maven-publish'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.9"
        }
    }

    dependencies {
        compileOnly("org.springframework.boot:spring-boot-starter-web")
        compileOnly("org.projectlombok:lombok")
        annotationProcessor("org.projectlombok:lombok")

        testImplementation("org.springframework.boot:spring-boot-starter-test")
        testCompileOnly("org.projectlombok:lombok")
        testAnnotationProcessor("org.projectlombok:lombok")
    }

    spotless {
        java {
            target 'src/*/java/**/*.java'
            googleJavaFormat('1.17.0')
            trimTrailingWhitespace()
            endWithNewline()
        }
        format 'misc', {
            target '*.gradle', '*.md', '.gitignore'
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    publishing {
        repositories {
            maven {
                name = "GitHubPackages"
                url = "https://maven.pkg.github.com/uw-it-edm/pws-client"
                credentials {
                    username = System.getenv("GITHUB_ACTOR") ?: System.getenv("USER")
                    password = System.getenv("GITHUB_TOKEN") ?: System.getenv("GITHUB_PAT")
                }
            }
        }

        publications {
            mavenJava(MavenPublication) {
                from components.java
                groupId = 'edu.uw.edm.pws'
            }
        }
    }
}
